<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Habibi Jobs</title><link rel="stylesheet" href="./product.css"><meta name="robots" content="noindex"></head><body class="auth-page"><main class="auth-shell"><div class="auth-top"><a class="brand" href="./">Habibi Jobs</a></div><div class="auth-grid"><aside class="auth-copy"><div class="eyebrow">Account recovery</div><h1>Get back to your radar.</h1></aside><section class="auth-card"><form id="resetForm"><h2 id="resetTitle">Reset your password</h2><div class="field" id="resetEmailField"><label for="resetEmail">Email address</label><input id="resetEmail" type="email" autocomplete="email" required></div><div class="field" id="resetPasswordField" hidden><label for="resetPassword">New password</label><input id="resetPassword" type="password" minlength="8" autocomplete="new-password"></div><p id="resetMessage" class="form-note" role="alert"></p><button class="button primary" type="submit">Send reset link →</button></form></section></div></main><script src="./auth-client.js"></script><script>
const form=document.querySelector("#resetForm"),message=document.querySelector("#resetMessage"),emailField=document.querySelector("#resetEmailField"),passwordField=document.querySelector("#resetPasswordField"),button=form.querySelector("button");
(async()=>{if(await window.HabibiAuth.getSession()){emailField.hidden=true;passwordField.hidden=false;document.querySelector("#resetPassword").required=true;button.textContent="Save new password →"}})();
form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;try{if(passwordField.hidden){await window.HabibiAuth.requestPasswordReset(document.querySelector("#resetEmail").value);message.textContent="Check your email for the secure reset link."}else{await window.HabibiAuth.updatePassword(document.querySelector("#resetPassword").value);message.textContent="Password updated. Redirecting…";setTimeout(()=>location.href="./dashboard.html",900)}}catch(error){message.textContent=error.message}finally{button.disabled=false}});
</script></body></html>
