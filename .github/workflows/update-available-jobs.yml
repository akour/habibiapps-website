name: Update available jobs

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-available-jobs
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check job links
        run: node available-jobs/scripts/refresh-jobs.mjs

      - name: Commit updated availability
        run: |
          if git diff --quiet -- available-jobs/data/jobs.json; then
            echo "No job data changed."
            exit 0
          fi
          git config user.name "habibiapps-jobs-bot"
          git config user.email "habibiapps-jobs-bot@users.noreply.github.com"
          git add available-jobs/data/jobs.json
          git commit -m "Refresh available jobs"
          git push
