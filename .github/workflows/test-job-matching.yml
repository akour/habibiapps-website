name: Test personalized job delivery
on:
  pull_request:
    paths:
      - 'available-jobs/**'
      - '.github/workflows/test-job-matching.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test available-jobs/scripts/*.test.mjs
